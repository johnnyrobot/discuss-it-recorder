name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Chromium recording, WebKit photos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm test
      # Playwright's Linux WebKit has no MediaRecorder, so the variants that record in
      # WebKit (webkit, ui, ui:photo, ui:decoder) run in the macOS job. These record in
      # Chromium. The HEIC check needs macOS sips and is skipped here.
      - run: node tests/run.mjs photos:chromium iphone worker-failure enumeration-failure demo demo:site

  macos:
    name: macOS (npm run test:all, Chromium and WebKit)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run build
      # Every variant in tests/run.mjs, including WebKit recording and the HEIC check.
      - run: npm run test:all
